name: Google Play release package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/play-store.yml'
      - 'play/**'
      - 'tool/package_play.sh'
      - 'tool/play_listing_assets.py'
      - 'assets/privacy_policy.txt'

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - name: Set up native project and live Firebase
        env:
          ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          flutter create --platforms android --org com.bilvok --project-name number_slide_pro .
          : "${ANDROID_CONFIG:?Set the production FIREBASE_ANDROID_CONFIG repository secret}"
          printf '%s' "$ANDROID_CONFIG" > android/app/google-services.json
          jq -e '.project_info.project_id == "number-slide-pro" and any(.client[]; .client_info.android_client_info.package_name == "com.bilvok.numberslidepro")' android/app/google-services.json >/dev/null
      - name: Build and verify release bundle and universal APK
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
          ADMOB_ANDROID_BANNER_UNIT_ID: ${{ vars.ADMOB_ANDROID_BANNER_UNIT_ID }}
          ADMOB_ANDROID_REWARDED_UNIT_ID: ${{ vars.ADMOB_ANDROID_REWARDED_UNIT_ID }}
        run: bash tool/package_play.sh
      - name: Upload Android release files
        uses: actions/upload-artifact@v4
        with:
          name: number-slide-pro-android-release
          path: play-package/android/
          if-no-files-found: error
          compression-level: 0
      - name: Set up store artwork rendering
        run: |
          python3 -m venv "$RUNNER_TEMP/play-art"
          "$RUNNER_TEMP/play-art/bin/pip" -q install Pillow==11.3.0 CairoSVG==2.8.2
          echo "$RUNNER_TEMP/play-art/bin" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          apk=$(find "$GITHUB_WORKSPACE/play-package/android" -name '*.apk' -type f)
          echo "PLAY_RELEASE_APK=$apk" >> "$GITHUB_ENV"
      - name: Capture real release screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CAPTURE_RESOLUTION: 1080x1920
          CAPTURE_DENSITY: 420
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1080x1920
          script: bash tool/verify_arcade_layout.sh
      - name: Assemble and validate English listing
        run: python3 tool/play_listing_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: number-slide-pro-google-play-listing
          path: play-package/listing/
          if-no-files-found: error
      - name: Assemble first-upload download
        run: |
          cp play/first-upload/FirstUpload.java play/first-upload/Start-First-Upload.cmd play/first-upload/First-upload-guide.html play-package/
          cp play/FIRST_UPLOAD.md play-package/
          echo "Source commit $GITHUB_SHA" > play-package/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: number-slide-pro-first-upload
          path: play-package/
          if-no-files-found: error
          compression-level: 0

  verify-windows-handoff:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: number-slide-pro-first-upload
          path: first-upload
      - name: Test the exact Windows launcher in a disposable runner
        shell: pwsh
        working-directory: first-upload
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NUMBER_SLIDE_HEADLESS = '1'
          $env:NUMBER_SLIDE_STOREPASS = [Convert]::ToBase64String([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $key = Join-Path $env:LOCALAPPDATA 'Bilvok/NumberSlidePro/Signing/upload.p12'
          $expectedNewKey = Test-Path 'android/NumberSlidePro-unsigned.aab'
          if (Test-Path $key) { throw 'Expected a clean Windows runner.' }
          try {
            & .\Start-First-Upload.cmd
            if ($LASTEXITCODE -ne 0) { throw 'First preparation failed.' }
            if (-not (Test-Path 'UPLOAD_TO_PLAY/NumberSlidePro-upload-signed.aab')) { throw 'Bundle missing.' }
            $cert = (Get-FileHash 'UPLOAD_TO_PLAY/upload-certificate.der').Hash
            if ($expectedNewKey) { $firstKey = (Get-FileHash $key).Hash }
            & .\Start-First-Upload.cmd
            if ($LASTEXITCODE -ne 0) { throw 'Second preparation failed.' }
            if ((Get-FileHash 'UPLOAD_TO_PLAY/upload-certificate.der').Hash -ne $cert) { throw 'Certificate changed.' }
            if ($expectedNewKey -and ((Get-FileHash $key).Hash -ne $firstKey)) { throw 'Upload key changed.' }
            if ((Get-ChildItem 'listing/en-US/images/phoneScreenshots' -Filter '*.png').Count -ne 5) { throw 'Screenshot set missing.' }
            Write-Output 'Windows preparation, signature verification, screenshot set and safe repeat run passed.'
          } finally {
            Remove-Item 'UPLOAD_TO_PLAY' -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $key -Force -ErrorAction SilentlyContinue
            Remove-Item Env:NUMBER_SLIDE_STOREPASS -ErrorAction SilentlyContinue
          }
