name: Android APK build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
      - name: Generate Android platform
        run: flutter create --platforms android --project-name number_slide_pro .
      - name: Set Android minimum SDK to 23
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text()
              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              s = s.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 23')
              p.write_text(s)
              print(f'Updated {filename} to minSdk 23')
              break
          else:
              raise SystemExit('Android app Gradle file not found')
          PY
      - name: Configure AdMob sample application ID for debug builds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace("<application", '<application android:usesCleartextTraffic="false"', 1)
          s = s.replace("</application>", '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\\n    </application>')
          s = s.replace('\\n    </application>', '\n    </application>')
          p.write_text(s)
          PY
      - run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: number-slide-pro-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
