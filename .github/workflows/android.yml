name: Android APK build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Anonymous Auth, Firestore rules and leaderboard queries
        run: npx --yes firebase-tools@14.27.0 emulators:exec --project demo-number-slide-pro --only auth,firestore "node --test test/leaderboard-emulators.mjs"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true
      - name: Generate remaining Android scaffold
        run: flutter create --platforms android --org com.bilvok --project-name number_slide_pro .
      - name: Select Firebase Android configuration
        id: firebase
        env:
          ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          if [[ -n "$ANDROID_CONFIG" ]]; then
            printf '%s' "$ANDROID_CONFIG" > android/app/google-services.json
          fi
          if [[ -f android/app/google-services.json ]]; then
            echo 'target=online' >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PY'
          import json
          from pathlib import Path
          Path("android/app/google-services.json").write_text(json.dumps({
              "project_info": {"project_number": "123456789012", "project_id": "demo-number-slide-pro"},
              "client": [{
                  "client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                                  "android_client_info": {"package_name": "com.bilvok.numberslidepro"}},
                  "api_key": [{"current_key": "demo-emulator-only"}]
              }],
              "configuration_version": "1"
          }))
          PY
            echo 'target=emulator' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify native package and Firebase client
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          app = Path("android/app")
          data = json.loads((app / "google-services.json").read_text())
          package = re.search(r'applicationId\s*=\s*"([^"]+)"', (app / "build.gradle.kts").read_text())[1]
          assert package == "com.bilvok.numberslidepro"
          clients = [c for c in data["client"] if c["client_info"]["android_client_info"]["package_name"] == package]
          assert len(clients) == 1 and clients[0]["api_key"][0]["current_key"]
          assert clients[0]["client_info"]["mobilesdk_app_id"].startswith("1:" + data["project_info"]["project_number"] + ":android:")
          assert data["project_info"]["project_id"]
          print("Verified Firebase Android registration for", package, "in", data["project_info"]["project_id"])
          PY
      - run: flutter analyze
      - run: flutter test test/widget_test.dart
      - name: Build debug APK
        env:
          TARGET: ${{ steps.firebase.outputs.target }}
        run: |
          if [[ "$TARGET" == emulator ]]; then
            flutter build apk --debug --dart-define=FIREBASE_EMULATORS=true
          else
            flutter build apk --debug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: number-slide-pro-${{ steps.firebase.outputs.target }}-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Check publisher configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: publisher
        env:
          APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
          BANNER_ID: ${{ vars.ADMOB_ANDROID_BANNER_UNIT_ID }}
          REWARDED_ID: ${{ vars.ADMOB_ANDROID_REWARDED_UNIT_ID }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          app, banner, rewarded = (os.environ[k] for k in ("APP_ID", "BANNER_ID", "REWARDED_ID"))
          if not any((app, banner, rewarded)):
              print("Publisher APK skipped: no AdMob repository variables have been set.")
          else:
              account = re.fullmatch(r"(ca-app-pub-[0-9]{16})~[0-9]{10}", app)
              if not account or account[1] == "ca-app-pub-3940256099942544":
                  raise SystemExit("Set ADMOB_ANDROID_APP_ID to the game's real Android AdMob app ID.")
              for name, unit in (("BANNER", banner), ("REWARDED", rewarded)):
                  if not re.fullmatch(account[1] + r"/[0-9]{10}", unit):
                      raise SystemExit(f"Set ADMOB_ANDROID_{name}_UNIT_ID to a unit from the same publisher.")
              if banner == rewarded:
                  raise SystemExit("Banner and rewarded placements require distinct ad unit IDs.")
              with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
                  print("configured=true", file=output)
          PY
      - name: Build APK with publisher ad units
        if: steps.publisher.outputs.configured == 'true'
        env:
          USE_EMULATORS: ${{ steps.firebase.outputs.target == 'emulator' }}
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
          BANNER_ID: ${{ vars.ADMOB_ANDROID_BANNER_UNIT_ID }}
          REWARDED_ID: ${{ vars.ADMOB_ANDROID_REWARDED_UNIT_ID }}
        run: |
          flutter build apk --release \
            "--dart-define=FIREBASE_EMULATORS=$USE_EMULATORS" \
            "--dart-define=ADMOB_ANDROID_BANNER_UNIT_ID=$BANNER_ID" \
            "--dart-define=ADMOB_ANDROID_REWARDED_UNIT_ID=$REWARDED_ID"
      - uses: actions/upload-artifact@v4
        if: steps.publisher.outputs.configured == 'true'
        with:
          name: number-slide-pro-${{ steps.firebase.outputs.target }}-publisher-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Enable KVM for Android verification
        if: steps.firebase.outputs.target == 'online' && github.event_name != 'pull_request'
        run: sudo chmod 666 /dev/kvm
      - name: Verify Android anonymous sign-in and live leaderboard read
        if: steps.firebase.outputs.target == 'online' && github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: flutter test integration_test/online_leaderboard_test.dart --dart-define=TEST_FIREBASE_PROJECT=$(jq -r .project_info.project_id android/app/google-services.json)
